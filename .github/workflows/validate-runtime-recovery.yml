name: Validate Windows runtime recovery

on:
  push:
    branches: [codex/lock-screen-recovery-1.0.54]

permissions:
  contents: read

concurrency:
  group: runtime-recovery-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Prepare dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
      - name: Frontend recovery behavior
        run: >-
          npm test -- src/utils/notification-delivery.test.ts
          src/utils/recovery-storage.test.ts src/services/sys-message.service.test.ts
          src/services/websocket.service.test.ts src/services/runtime-recovery.service.test.ts src/stores/task.test.ts
          src/utils/mascot-panel-access.test.ts
      - run: node scripts/qa/check-runtime-recovery.mjs
      - run: npm run build:intranet
      - name: Native recovery policy and compilation
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml runtime_health
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        shell: pwsh
        run: |
          $env:BUILD_MODE = 'intranet'
          npm run tauri -- build --no-bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native process failure and session recovery
        shell: pwsh
        run: |
          & ./scripts/windows-msi/Test-HualiAIRuntimeRecovery.ps1 `
            -ExecutablePath ./src-tauri/target/release/HualiAIDesktopAssistant.exe `
            -OutputDirectory ./artifacts/runtime-recovery-qa/windows-runtime
      - name: Native window behavior
        shell: pwsh
        run: |
          & ./scripts/windows-msi/Test-HualiAIWindowsVisualSmoke.ps1 `
            -ExecutablePath ./src-tauri/target/release/HualiAIDesktopAssistant.exe `
            -OutputDirectory ./artifacts/runtime-recovery-qa/windows-visual
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-recovery-${{ github.run_id }}
          path: |
            artifacts/runtime-recovery-qa/
            src-tauri/target/release/HualiAIDesktopAssistant.exe
          retention-days: 14
